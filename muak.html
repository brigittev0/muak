<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dibujo reconstruido píxel por píxel</title>
<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  background:#fff;
  overflow:hidden;
}
body {
  display:flex;
  justify-content:center;
  align-items:center;
}
.contenedor {
  width:min(92vw, 620px);
  min-height:96vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:18px 10px 30px;
}
canvas {
  width:min(70vw, 470px);
  height:auto;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  animation: balanceo 2.6s ease-in-out infinite;
  transform-origin:50% 85%;
}
@keyframes balanceo {
  0%,100% { transform:translateY(0) rotate(0deg); }
  25% { transform:translateY(-4px) rotate(-1deg); }
  50% { transform:translateY(0) rotate(1deg); }
  75% { transform:translateY(-3px) rotate(-.7deg); }
}

.mensaje {
  text-align:center;
  margin-top:4px;
  color:#a84f69;
  font-family:Arial,sans-serif;
  font-weight:700;
  font-size:25px;
  line-height:1.35;
}
#corazones {
  margin-top:16px;
  border:0;
  border-radius:30px;
  padding:13px 28px;
  background:#d86b91;
  color:white;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(130,40,80,.18);
  transition:transform .15s ease, background .15s ease;
}
#corazones:hover {
  background:#c95d83;
  transform:scale(1.04);
}
#corazones:active {
  transform:scale(.96);
}
.corazon-flotante {
  position: fixed;
  left: 0;
  top: 0;
  pointer-events: none;
  z-index: 9999;
  font-size: 25px;
  animation-name: llenarPantalla;
  animation-timing-function: ease-out;
  animation-fill-mode: forwards;
}

@keyframes llenarPantalla {
  0% {
    opacity: 0;
    transform: translate(0, 0) scale(0.25) rotate(0deg);
  }

  12% {
    opacity: 1;
  }

  70% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform:
      translate(var(--x), var(--y))
      scale(1.35)
      rotate(var(--r));
  }
}

</style>
</head>

const canvas = document.getElementById("dibujo");
const ctx = canvas.getContext("2d");
const imagen = ctx.createImageData(ANCHO, ALTO);

for (let i = 0; i < PIXELES.length; i++) {
    const p = PIXELES[i];
    const j = i * 4;
    imagen.data[j]     = (p >>> 24) & 255;
    imagen.data[j + 1] = (p >>> 16) & 255;
    imagen.data[j + 2] = (p >>> 8) & 255;
    imagen.data[j + 3] = p & 255;
}

ctx.putImageData(imagen, 0, 0);

const botonCorazones = document.getElementById("corazones");

botonCorazones.addEventListener("click", () => {

  const simbolos = ["☕", "💕", "💘", "☕", "❤️"];

  // Cantidad de corazones que aparecerán.
  for (let i = 0; i < 100; i++) {

    const corazon = document.createElement("span");

    corazon.className = "corazon-flotante";

    // Corazón aleatorio.
    corazon.textContent =
      simbolos[Math.floor(Math.random() * simbolos.length)];

    // Posición inicial aleatoria por TODA la pantalla.
    const inicioX = Math.random() * window.innerWidth;
    const inicioY = Math.random() * window.innerHeight;

    corazon.style.left = inicioX + "px";
    corazon.style.top = inicioY + "px";

    // Dirección y distancia aleatoria.
    corazon.style.setProperty(
      "--x",
      (Math.random() * 600 - 300) + "px"
    );

    corazon.style.setProperty(
      "--y",
      (Math.random() * 600 - 300) + "px"
    );

    // Giro aleatorio.
    corazon.style.setProperty(
      "--r",
      (Math.random() * 720 - 360) + "deg"
    );

    // Tamaño aleatorio.
    corazon.style.fontSize =
      (18 + Math.random() * 30) + "px";

    // Duración aleatoria.
    const duracion = 2 + Math.random() * 3;
    corazon.style.animationDuration = duracion + "s";

    // Algunos aparecen ligeramente después.
    corazon.style.animationDelay =
      (Math.random() * 0.8) + "s";

    document.body.appendChild(corazon);

    // Eliminar para no acumular elementos.
    setTimeout(() => {
      corazon.remove();
    }, (duracion + 1) * 1000);
  }
});

</script>
